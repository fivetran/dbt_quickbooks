version: 1.11.1
pr_number: 235
under_the_hood:
- description: Replaces `fivetran_utils.enabled_vars` in model configs with `and` and an explicit `true`
    default for each variable, so each model's default shows where it's used. Unset variables still
    default to `true`.
- description: Replaces `fivetran_utils.enabled_vars_one_true` with `or` and an explicit `false` default for
    each variable. Unset variables still default to `false`.
