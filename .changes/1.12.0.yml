version: 1.12.0
pr_number: 237
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_quickbooks/issues/new/choose).
under_the_hood:
  details:
  - Adds `source_relation` to `stg_quickbooks__invoice_tax_line`, `stg_quickbooks__journal_entry_tax_line`,
    `stg_quickbooks__purchase_tax_line`, `stg_quickbooks__refund_receipt_tax_line`,
    and `stg_quickbooks__sales_receipt_tax_line`.
  - Adds `_fivetran_deleted` to `stg_quickbooks__bill_tax_line`, `stg_quickbooks__credit_memo_tax_line`,
    `stg_quickbooks__deposit_tax_line`, `stg_quickbooks__estimate_tax_line`, `stg_quickbooks__invoice_tax_line`,
    `stg_quickbooks__purchase_tax_line`, and `stg_quickbooks__sales_receipt_tax_line`.
  - Adds `payable_account_id` to `stg_quickbooks__bill_payment`.
  - Adds `sync_token` to `stg_quickbooks__tax_agency`.
date: '2026-11-18'
